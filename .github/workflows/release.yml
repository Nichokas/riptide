name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

  build:
    needs: test
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: riptide
          - target: x86_64-apple-darwin
            os: macos-latest-large
            binary_name: riptide
          - target: aarch64-apple-darwin
            os: macos-latest-large
            binary_name: riptide

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Determine archive name
        id: archive
        run: |
          if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" ]]; then
            ARCHIVE_NAME="riptide-${{ github.ref_name }}-x86_64-linux-gnu"
          else
            ARCHIVE_NAME="riptide-${{ github.ref_name }}-${{ matrix.target }}"
          fi
          echo "name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT

      - name: Create archive (Unix)
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ steps.archive.outputs.name }}.tar.gz ${{ matrix.binary_name }}
          cd ../../../
          sha256sum ${{ steps.archive.outputs.name }}.tar.gz > ${{ steps.archive.outputs.name }}.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: riptide-${{ github.ref_name }}-${{ matrix.target }}
          path: |
            ${{ steps.archive.outputs.name }}.tar.gz
            ${{ steps.archive.outputs.name }}.tar.gz.sha256

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          # Extract the section for this version
          awk "/## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release_notes.txt

          # If release notes are empty, it means version wasn't found in CHANGELOG
          if [ ! -s release_notes.txt ]; then
            echo "⚠️ Version ${VERSION} not found in CHANGELOG.md" > release_notes.txt
            echo "Please update CHANGELOG.md with release notes for this version." >> release_notes.txt
          fi

          cat release_notes.txt

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec cp {} release-files/ \;
          ls -lah release-files/

      - name: Create checksums file
        run: |
          cd release-files
          cat *.sha256 > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          body_path: release_notes.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  aur-update:
    name: Update AUR
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download tarball and compute sha256sum
        id: sha256
        run: |
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz"
          SHA=$(curl -sL "$URL" | sha256sum | cut -d' ' -f1)
          echo "SHA256=$SHA" >> $GITHUB_OUTPUT

      - name: Set up SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          cat >> ~/.ssh/config << EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
            StrictHostKeyChecking no
          EOF

      - name: Clone AUR repo
        run: git clone ssh://aur@aur.archlinux.org/riptide.git aur-riptide

      - name: Update PKGBUILD
        run: |
          cd aur-riptide
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.VERSION }}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/sha256sums=('.*')/sha256sums=('${{ steps.sha256.outputs.SHA256 }}')/" PKGBUILD
          sed -i "s|riptide-[0-9]*\.[0-9]*\.[0-9]*\.tar\.gz|riptide-${{ steps.version.outputs.VERSION }}.tar.gz|g" PKGBUILD
          sed -i "s|/tags/v[0-9]*\.[0-9]*\.[0-9]*\.tar\.gz|/tags/v${{ steps.version.outputs.VERSION }}.tar.gz|g" PKGBUILD

      - name: Update .SRCINFO
        run: |
          cd aur-riptide
          sed -i "s/pkgver = .*/pkgver = ${{ steps.version.outputs.VERSION }}/" .SRCINFO
          sed -i "s/pkgrel = .*/pkgrel = 1/" .SRCINFO
          sed -i "s/sha256sums = .*/sha256sums = ${{ steps.sha256.outputs.SHA256 }}/" .SRCINFO
          # Update source URL version
          sed -i "s|riptide-[0-9]*\.[0-9]*\.[0-9]*\.tar\.gz|riptide-${{ steps.version.outputs.VERSION }}.tar.gz|g" .SRCINFO
          sed -i "s|/tags/v[0-9]*\.[0-9]*\.[0-9]*\.tar\.gz|/tags/v${{ steps.version.outputs.VERSION }}.tar.gz|g" .SRCINFO

      - name: Commit and push to AUR
        run: |
          cd aur-riptide
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add PKGBUILD .SRCINFO
          git diff --staged --quiet || git commit -m "update to ${{ github.ref_name }}"
          git push
