name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libglib2.0-dev libchafa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

  build-linux:
    name: Build x86_64-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libglib2.0-dev libchafa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target x86_64-unknown-linux-gnu

  build-macos-intel:
    name: Build x86_64-macos
    runs-on: macos-13-large
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          brew install chafa
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target x86_64-apple-darwin

  build-macos-arm:
    name: Build aarch64-macos (native ARM)
    runs-on: macos-latest-large
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: brew install chafa

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release (native ARM64)
        run: cargo build --release
