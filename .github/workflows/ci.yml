name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No system dependencies or cache: `cargo fmt` parses the source without
      # building it, so nothing here needs to link against libssl/dbus.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check riptide.spec version matches Cargo.toml
        run: |
          set -euo pipefail
          CARGO_VER=$(sed -n '0,/^version = /s/^version = "\(.*\)"/\1/p' Cargo.toml)
          SPEC_VER=$(sed -n 's/^Version:[[:space:]]*//p' riptide.spec)
          if [ "$CARGO_VER" != "$SPEC_VER" ]; then
            echo "::error::riptide.spec is $SPEC_VER but Cargo.toml is $CARGO_VER."
            echo "COPR builds the spec as committed, so a stale Version ships the wrong release."
            exit 1
          fi
          echo "Version $CARGO_VER matches."

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libglib2.0-dev libchafa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test
